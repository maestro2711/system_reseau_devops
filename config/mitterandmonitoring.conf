[general]
interval=300
data_dir=/var/lib/monitoring
log_dir=/var/log/monitoring
log_level=info
auto_actions=true

[disk]
threshold_warning=80
threshold_critical=90
mountpoints=/,/home,/var
enable_lvm_extension=true
lvm_extend_size=5G

[cpu]
threshold_warning=70
threshold_critical=90

[ram]
threshold_warning=75
threshold_critical=90

[mail]
enable_alerts=true
smtp_server=smtp.example.com
smtp_port=587
smtp_user=assaguim@gmail.com
smtp_password=CHANGER-MOI
from=assaguim@gmail.com
to=asmitterand@yahoo.fr

[central_logging]
enable=true
server=logs.example.com
port=514
protocol=udp
tag=monitoring

[web]
enable=true
webroot=/var/www/monitoring
template=/usr/share/monitoring/template.html
